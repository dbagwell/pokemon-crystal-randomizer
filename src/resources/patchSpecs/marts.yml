description: "Changes the data for the marts items."
values:
  martData: "@#marts.$data @$mockRooftopShopData #marts.$data $mockRooftopShopData"
  mockRooftopShopData: "0A 00 00 00 00 00 00 00 00 00 00 FF"
changes:
- description: "Changes the data for the marts items."
  locations:
  - bank: 5
  value: "$martData"
- description: "References the new location for the mart data."
  locations:
  - bank: 5
    address: 0x5B3D
  value: "@$martData"
- description: "Update the number of marts when check if mart index is valid"
  locations:
  - bank: 5
    address: 0x5B33
  value: "$numberOfMarts"
- description: "Don't try to load a default mart if mart index is not valid"
  locations:
  - bank: 5
    address: 0x5B36
  value: "C9"
freeSpaces:
  - bank: 5
    address: 0x60A9
    size: 367